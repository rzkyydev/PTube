<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>PTube</title>
<link rel="icon" href="/icon.png">
<link rel="canonical" href="/en">
<style>
  :root { --bg:#faf7f5; --fg:#1b1b1f; --muted:#6b6b76; --accent:#ff6b9d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090c; --fg:#f4f4f6; --muted:#9a9aa6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  img { width: 72px; height: 72px; border-radius: 18px; animation: bob 1.1s ease-in-out infinite; }
  .name { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .bar { width: 120px; height: 4px; border-radius: 4px; background: var(--muted); opacity: .25; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 4px; animation: slide 1s ease-in-out infinite; }
  .msg { font-size: 14px; color: var(--muted); }
  .msg a { color: inherit; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
  @media (prefers-reduced-motion: reduce) { img, .bar i { animation: none; } }
</style>
</head>
<body>
  <img src="/icon.png" alt="" width="72" height="72">
  <div class="name">PTube</div>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="msg" id="msg" role="status">Loading…</div>
  <noscript>
    <div class="msg"><a href="/en">English</a> · <a href="/id">Bahasa Indonesia</a></div>
    <meta http-equiv="refresh" content="0;url=/en">
  </noscript>
<script>
(function () {
  var DELAY = 900; // ms, lama tampilan loading sebelum pindah
  var lang = "en";
  try {
    var m = document.cookie.match(/(?:^|; )ptube-lang-pref=([^;]*)/);
    var pref = m && m[1];
    if (pref === "id" || pref === "en") {
      lang = pref; // pilihan manual user menang
    } else {
      var l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      lang = String(l[0]).toLowerCase().indexOf("id") === 0 ? "id" : "en";
    }
  } catch (e) {}

  var target = "/" + lang + location.search + location.hash;
  var msg = document.getElementById("msg");
  if (msg) {
    msg.innerHTML = lang === "id"
      ? 'Memuat… <a href="' + target + '">Klik di sini jika tidak berpindah</a>'
      : 'Loading… <a href="' + target + '">Click here if you are not redirected</a>';
  }
  document.documentElement.lang = lang;

  try { var p = document.createElement("link"); p.rel = "prefetch"; p.href = "/" + lang; document.head.appendChild(p); } catch (e) {}

  setTimeout(function () { location.replace(target); }, DELAY);
})();
</script>
</body>
</html>
